name: Release

# Publishes r3f-afterburner to npm when a v* tag is pushed
#
# Only the maintainer releases. The guards, from GitHub's side to npm's:
# - a tag ruleset lets only the maintainer create v* tags
# - the job only runs for the maintainer's own push, and waits in the `npm`
#   environment for the maintainer's approval
# - npm trusted publishing (OIDC) publishes with provenance, so no npm token is
#   stored anywhere, and the package is set to require 2FA and disallow tokens
#
# See CONTRIBUTING.md, "Releasing", for the one-time setup

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'Romainlg29' && github.actor == 'Romainlg29' && github.triggering_actor == 'Romainlg29'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/r3f-afterburner
    permissions:
      contents: read
      # For npm's trusted publishing and provenance
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The tag has to name the version being published
      - name: Check the tag against the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/afterburner/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match package version $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm test

      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@^11.5.1
      - run: pnpm build
      # Only what an install needs: dist, README, LICENSE and a package.json
      # without the scripts and dev dependencies
      - name: Publish
        working-directory: packages/afterburner
        run: |
          npm pkg delete scripts devDependencies
          npm pack --dry-run
          npm publish --access public --provenance --ignore-scripts
