name: Release

# Publishes one @aeronautic package to npm when its tag is pushed:
# afterburner-vX.Y.Z publishes packages/afterburner, wing-vapor-vX.Y.Z
# publishes packages/wing-vapor, and core-vX.Y.Z and controls-vX.Y.Z the same.
# The others depend on core, so a core they need is released before them
#
# Only the maintainer releases. The guards, from GitHub's side to npm's:
# - a tag ruleset lets only the maintainer create release tags
# - the job only runs for the maintainer's own push, and waits in the `npm`
#   environment for the maintainer's approval
# - npm trusted publishing (OIDC) publishes with provenance, so no npm token is
#   stored anywhere, and each package is set to require 2FA and disallow tokens
#
# Once it's published, a GitHub release is created for the tag, with notes
# generated from the PRs and commits since that package's previous tag
#
# See CONTRIBUTING.md, "Releasing", for the one-time setup

on:
  push:
    tags: ["core-v*", "afterburner-v*", "wing-vapor-v*", "controls-v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'Romainlg29' && github.actor == 'Romainlg29' && github.triggering_actor == 'Romainlg29'
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    environment:
      name: npm
      url: https://www.npmjs.com/package/@aeronautic/${{ steps.tag.outputs.package }}
    permissions:
      contents: read
      # For npm's trusted publishing and provenance
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The tag names the package and the version being published:
      # <package>-vX.Y.Z, where <package> is a folder in packages/
      - name: Read the package and version from the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="${TAG%-v*}"
          tag_version="${TAG##*-v}"
          case "$package" in
            core | afterburner | wing-vapor | controls) ;;
            *)
              echo "Tag $TAG doesn't name a package that's released from here" >&2
              exit 1
              ;;
          esac
          version=$(node -p "require('./packages/$package/package.json').version")
          if [ "$tag_version" != "$version" ]; then
            echo "Tag $TAG doesn't match $package's version $version" >&2
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm test

      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@^11.5.1
      - run: pnpm build
      # Only what an install needs: dist, README, LICENSE and a package.json
      # without the scripts and dev dependencies. pnpm packs it, so a
      # workspace:^ dependency on core becomes the version it's at; npm
      # publishes the tarball, for trusted publishing
      - name: Publish
        working-directory: packages/${{ steps.tag.outputs.package }}
        run: |
          npm pkg delete scripts devDependencies
          tarball=$(pnpm pack --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).filename")
          tar -xOzf "$tarball" package/package.json
          if tar -xOzf "$tarball" package/package.json | grep -q '"workspace:'; then
            echo "The packed package.json still names a workspace: version" >&2
            exit 1
          fi
          npm publish "$tarball" --access public --provenance --ignore-scripts

  # The GitHub release for the tag, once the package is on npm. A job of its
  # own, so the one that can write to the repo never touches npm
  github-release:
    needs: publish
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ needs.publish.outputs.package }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          # The package's previous release, newest first. Afterburner was
          # tagged vX.Y.Z before the repo held more than one package, so those
          # count as its releases too
          previous=""
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            case "$tag" in
              "$TAG") ;;
              "$PACKAGE"-v*) previous="$tag"; break ;;
              v*) if [ "$PACKAGE" = afterburner ]; then previous="$tag"; break; fi ;;
            esac
          done

          # Afterburner stays the repo's "Latest" release
          latest=false
          if [ "$PACKAGE" = afterburner ]; then latest=true; fi

          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
            --title "@aeronautic/$PACKAGE $VERSION" "--latest=$latest")
          if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
          gh release create "$TAG" "${args[@]}"
